<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#38b6ff">
<title>Fox Money</title><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef8ff;--card:#fff;--tx:#10222f;--mut:#5d7586;--sky:#38b6ff;--sky2:#0e8fe0;--bd:#d3e8f6;--ok:#168a4a;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0b1722;--card:#13232f;--tx:#eaf5fc;--mut:#8fb0c4;--bd:#223a4a;--ok:#5fd68f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--sky2)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--sky);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(56,182,255,.4)}
.logo svg{width:82%;height:82%}
.lg{text-align:center;padding-top:6vh}
.lg .logo{width:84px;height:84px;border-radius:22px;margin:0 auto 12px}
.lg h2{margin:0 0 16px;color:var(--sky2)}
.lg .card{text-align:left}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.bal{background:linear-gradient(135deg,var(--sky),var(--sky2));color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}
.amount{font-size:38px;font-weight:800;margin-top:4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;cursor:pointer;background:var(--sky2);color:#fff}
button:disabled{opacity:.6}
button.alt{background:var(--card);color:var(--sky2);border:2px solid var(--sky)}
.lnk{background:none;border:0;color:var(--sky2);font-weight:600;margin-top:10px;width:100%;padding:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.hide{display:none}
.msg{font-size:14px;margin-top:8px;color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.mut{color:var(--mut);font-size:13px}
.in{color:var(--ok);font-weight:700}.out{font-weight:700}
.note{text-align:center;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="fx" viewBox="0 0 64 64"><polygon points="8,4 28,20 6,32" fill="#ff8a1f"/><polygon points="56,4 36,20 58,32" fill="#ff8a1f"/><polygon points="11,12 22,21 10,27" fill="#6b3208"/><polygon points="53,12 42,21 54,27" fill="#6b3208"/><path d="M6 27 L22 19 H42 L58 27 L48 47 L32 59 L16 47 Z" fill="#ff8a1f"/><polygon points="32,59 15,47 21,37 32,47 43,37 49,47" fill="#fff"/><circle cx="23" cy="32" r="2.8" fill="#1a1a1a"/><circle cx="41" cy="32" r="2.8" fill="#1a1a1a"/><circle cx="32" cy="55" r="3" fill="#1a1a1a"/></symbol></svg>
<main>
<div id="login" class="lg">
<div class="logo"><svg viewBox="0 0 64 64"><use href="#fx"/></svg></div>
<h2>Fox Money</h2>
<div class="card">
<strong id="lt">Connexion</strong>
<label for="lid">Identifiant</label>
<input id="lid" type="text" autocomplete="username" autocapitalize="none" placeholder="Ex. : awa225">
<label for="lpin">Code secret (6 caractères minimum)</label>
<input id="lpin" type="password" autocomplete="current-password">
<div class="msg" id="lm"></div>
<button id="lgo" style="width:100%;margin-top:12px">Se connecter</button>
<button class="lnk" id="lsw">Créer un compte</button>
</div>
<div class="note">Version de test : aucun vrai argent n’est utilisé.</div>
</div>

<div id="app" class="hide">
<div class="top">
<div class="brand"><div class="logo"><svg viewBox="0 0 64 64"><use href="#fx"/></svg></div>Fox Money</div>
<select id="cur"><option>€</option><option>$</option><option>FCFA</option></select>
</div>
<div class="bal"><small>Solde disponible</small><div class="amount" id="bal">0,00</div>
<div style="margin-top:8px;font-size:13px">Mon identifiant Fox : <b id="fid"></b></div></div>
<div class="acts"><button id="bSend">Envoyer</button><button class="alt" id="bAdd">Ajouter</button></div>

<div class="card hide" id="pSend">
<strong>Envoyer de l’argent</strong>
<label for="to">Identifiant Fox du destinataire</label>
<input id="to" type="text" autocapitalize="characters" placeholder="Ex. : FOX-7K3Q2M">
<label for="sa">Montant</label>
<input id="sa" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
<label for="sn">Message (facultatif)</label>
<input id="sn" type="text">
<div class="msg" id="sm"></div>
<button id="goSend" style="width:100%;margin-top:12px">Confirmer l’envoi</button>
</div>

<div class="card hide" id="pAdd">
<strong>Dépôt d’argent</strong>
<div class="mut" style="margin-top:8px">Les dépôts par Mobile Money seront bientôt disponibles.</div>
</div>

<div class="card"><div class="mut">Activité récente</div><div id="list"></div></div>
<div class="note">Version de test : aucun vrai argent n’est utilisé.</div>
<button class="lnk" id="out">Se déconnecter</button>
</div>
</main>
<script>
var SB_URL="https://ygcngxjioefndeiafmjo.supabase.co";
var SB_KEY="sb_publishable_N41kEm484atPeK8SdCgWsQ_W-vkQeAK";
var sb=supabase.createClient(SB_URL,SB_KEY);
var reg=false,cur="€";
try{cur=localStorage.getItem("fox-cur")||"€";}catch(e){}
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function num(v){return parseFloat(String(v).replace(",","."));}
function fmt(n){return Number(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+cur;}
function em(id){return id+"@users.foxmoney.app";}
function mode(r){reg=r;$("lt").textContent=r?"Créer un compte":"Connexion";$("lgo").textContent=r?"Créer mon compte":"Se connecter";$("lsw").textContent=r?"J’ai déjà un compte":"Créer un compte";$("lm").textContent="";}
function showApp(on){$("login").classList.toggle("hide",on);$("app").classList.toggle("hide",!on);}
function nice(e){var m=(e&&e.message)||"Erreur";
if(/Invalid login/i.test(m))return"Identifiant ou code secret incorrect.";
if(/already registered/i.test(m))return"Cet identifiant existe déjà.";
if(/at least 6/i.test(m))return"Le code secret doit avoir au moins 6 caractères.";
if(/violates check constraint/i.test(m))return"Solde insuffisant.";
return m;}
async function refresh(){
var u=(await sb.auth.getUser()).data.user;if(!u){showApp(false);return;}
var p=await sb.from("profiles").select("username,fox_id,balance").eq("id",u.id).single();
var t=await sb.from("transactions").select("sender,receiver,amount,note,created_at").order("created_at",{ascending:false}).limit(30);
if(p.error){$("lm").textContent=nice(p.error);showApp(false);return;}
$("bal").textContent=fmt(p.data.balance);$("fid").textContent=p.data.fox_id;$("cur").value=cur;
var rows=(t.data||[]).map(function(x){var inn=x.receiver===u.id;
return '<div class="row"><div><div>'+(inn?"Reçu":"Envoyé")+'</div><div class="mut">'+new Date(x.created_at).toLocaleDateString("fr-FR")+(x.note?' · '+esc(x.note):'')+'</div></div><div class="'+(inn?'in':'out')+'">'+(inn?'+':'−')+fmt(x.amount)+'</div></div>';}).join("");
$("list").innerHTML=rows||'<div class="mut" style="padding-top:8px">Aucune opération pour l’instant.</div>';
showApp(true);
}
$("lsw").onclick=function(){mode(!reg);};
$("lgo").onclick=async function(){
var id=$("lid").value.trim().toLowerCase(),pin=$("lpin").value;
if(!/^[a-z0-9._-]{3,20}$/.test(id)){$("lm").textContent="Identifiant : 3 à 20 caractères (lettres, chiffres, . _ -).";return;}
if(pin.length<6){$("lm").textContent="Le code secret doit avoir au moins 6 caractères.";return;}
$("lgo").disabled=true;$("lm").textContent="";
var r;
if(reg){r=await sb.auth.signUp({email:em(id),password:pin,options:{data:{username:id}}});
if(!r.error&&!r.data.session){r=await sb.auth.signInWithPassword({email:em(id),password:pin});}}
else{r=await sb.auth.signInWithPassword({email:em(id),password:pin});}
$("lgo").disabled=false;
if(r.error){$("lm").textContent=nice(r.error);return;}
$("lpin").value="";await refresh();
};
$("out").onclick=async function(){await sb.auth.signOut();$("lid").value="";$("lpin").value="";mode(false);showApp(false);};
function panel(id){["pSend","pAdd"].forEach(function(p){$(p).classList.toggle("hide",p!==id||!$(p).classList.contains("hide"));});$("sm").textContent="";}
$("bSend").onclick=function(){panel("pSend");};
$("bAdd").onclick=function(){panel("pAdd");};
$("cur").onchange=function(){cur=$("cur").value;try{localStorage.setItem("fox-cur",cur);}catch(e){}refresh();};
$("goSend").onclick=async function(){
var to=$("to").value.trim(),m=num($("sa").value);
if(!to){$("sm").textContent="Indiquez l’identifiant Fox du destinataire.";return;}
if(!(m>0)){$("sm").textContent="Entrez un montant valide.";return;}
var r=await sb.rpc("send_money",{to_fox_id:to,amt:m,msg:$("sn").value.trim()||null});
if(r.error){$("sm").textContent=nice(r.error);return;}
$("to").value="";$("sa").value="";$("sn").value="";$("pSend").classList.add("hide");refresh();
};
mode(false);
sb.auth.getSession().then(function(s){if(s.data.session)refresh();});
</script>
</body>
  </html>
